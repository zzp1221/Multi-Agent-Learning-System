server:
  port: ${APP_PORT:8081}

spring:
  application:
    name: zhixue-control-plane
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.data.mongo.MongoRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.data.redis.RedisRepositoriesAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:zhixue}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 10000
  data:
    mongodb:
      uri: ${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/zhixue}
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 5s
  jackson:
    default-property-inclusion: non_null
    serialization:
      write-dates-as-timestamps: false
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  threads:
    virtual:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: always

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html

app:
  python-agent:
    base-url: ${PYTHON_AGENT_BASE_URL:http://localhost:8000}
    internal-token: ${PYTHON_AGENT_INTERNAL_TOKEN:}
    connect-timeout: 5s
    read-timeout: 10m
    max-retries: 2
    retry-backoff: 1s
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost,http://localhost:80,http://localhost:5173,http://localhost:5174}
  security:
    jwt:
      issuer: zhixue-control-plane
      secret: ${APP_JWT_SECRET:}
      access-token-ttl: 2h
      refresh-token-ttl: 7d
  idempotency:
    ttl: ${APP_IDEMPOTENCY_TTL:24h}
  rate-limit:
    enabled: ${APP_RATE_LIMIT_ENABLED:true}
    user-requests-per-minute: ${APP_RATE_LIMIT_USER_PER_MINUTE:240}
    ip-requests-per-minute: ${APP_RATE_LIMIT_IP_PER_MINUTE:600}
  download:
    artifact-ttl-seconds: ${APP_DOWNLOAD_ARTIFACT_TTL_SECONDS:1800}
  upload:
    image-max-bytes: ${APP_UPLOAD_IMAGE_MAX_BYTES:10485760}
    image-token-ttl-seconds: ${APP_UPLOAD_IMAGE_TOKEN_TTL_SECONDS:1800}
    image-storage-dir: ${APP_UPLOAD_IMAGE_STORAGE_DIR:sandbox-temp/chat-images}
  smart-engine-queue:
    stream-key: ${SMART_ENGINE_TASK_STREAM_KEY:zhixue:smart-engine:tasks}
    dlq-key: ${SMART_ENGINE_TASK_DLQ_KEY:zhixue:smart-engine:tasks:dlq}
    consumer-group: ${SMART_ENGINE_TASK_CONSUMER_GROUP:smart-engine-python}
    cancel-key-prefix: ${SMART_ENGINE_TASK_CANCEL_KEY_PREFIX:zhixue:smart-engine:cancel:}
    cancel-ttl: ${SMART_ENGINE_TASK_CANCEL_TTL:24h}
  voice:
    enabled: ${VOICE_ENABLED:true}
    provider: ${VOICE_PROVIDER:bailian}
    api-key: ${VOICE_API_KEY:${BAILIAN_API_KEY:}}
    asr-model: ${VOICE_ASR_MODEL:qwen3-asr-flash-realtime}
    asr-websocket-url: ${VOICE_ASR_WEBSOCKET_URL:wss://dashscope.aliyuncs.com/api-ws/v1/realtime}
    tts-model: ${VOICE_TTS_MODEL:qwen3-tts-flash-realtime}
    tts-websocket-url: ${VOICE_TTS_WEBSOCKET_URL:wss://dashscope.aliyuncs.com/api-ws/v1/realtime}
    tts-voice: ${VOICE_TTS_VOICE:Cherry}
    sample-rate: ${VOICE_SAMPLE_RATE:16000}
    max-audio-seconds: ${VOICE_MAX_AUDIO_SECONDS:60}
    max-audio-bytes: ${VOICE_MAX_AUDIO_BYTES:10485760}
    connect-timeout: ${VOICE_CONNECT_TIMEOUT:5s}
    request-timeout: ${VOICE_REQUEST_TIMEOUT:90s}
    session-ttl: ${VOICE_SESSION_TTL:300s}
    asr-prewarm-ttl: ${VOICE_ASR_PREWARM_TTL:60s}
    tts-first-audio-timeout: ${VOICE_TTS_FIRST_AUDIO_TIMEOUT:3s}
    asr-vad-silence-duration-ms: ${VOICE_ASR_VAD_SILENCE_DURATION_MS:1200}
    asr-vad-threshold: ${VOICE_ASR_VAD_THRESHOLD:0.5}
    provider-max-retries: ${VOICE_PROVIDER_MAX_RETRIES:1}
    provider-retry-backoff: ${VOICE_PROVIDER_RETRY_BACKOFF:300ms}
    max-concurrent-sessions-per-user: ${VOICE_MAX_CONCURRENT_SESSIONS_PER_USER:2}
